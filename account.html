<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | BCMS</title><link rel="stylesheet" href="style.css"><style>
.page{max-width:900px;margin:55px auto;padding:0 20px}.panel{background:#101c30;border:1px solid #233651;border-radius:12px;padding:24px;margin:20px 0}.muted{color:#91a1ba}.item{padding:16px 0;border-bottom:1px solid #233651}.item:last-child{border:0}.status{color:#8fc2ff;background:#142e50;padding:5px 9px;border-radius:20px;font-size:12px}.empty{padding:20px;background:#0b1425;border-radius:8px;color:#91a1ba}
</style></head><body><header class="navbar"><a href="index.html" class="logo">BCMS<span>.</span></a><nav><a href="clans.html">Clans</a><a href="council.html">Council</a><a href="chat.html">Live Chat</a><a href="apply.html">Register Clan</a><a href="https://bonk.io/" target="_blank" rel="noopener">Bonk.io</a></nav><div class="nav-actions"><a class="login" href="index.html">Home</a></div></header>
<main class="page"><p class="eyebrow">COMMUNITY MEMBER</p><h1>My Account</h1><section class="panel"><h2 id="username">Loading account…</h2><p class="muted" id="email"></p><p class="muted" id="joined"></p><div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><a class="button" href="apply.html">Register a Clan</a><button class="button secondary" id="logout">Log Out</button></div></section>
<section class="panel"><h2>My Clans</h2><div id="myClans" class="muted">Loading…</div></section><section class="panel"><h2>My Clan Applications</h2><div id="myApps" class="muted">Loading…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{const {data:{session}}=await db.auth.getSession();if(!session){location.href="auth.html";return;}const u=session.user;$("username").textContent=u.user_metadata?.username||"Community Member";$("email").textContent=u.email||"";$("joined").textContent="Member since "+new Date(u.created_at).toLocaleDateString();
const [members,apps]=await Promise.all([db.from("clan_members").select("clan_id,role,joined_at").eq("user_id",u.id).order("joined_at",{ascending:false}),db.from("clan_applications").select("id,clan_name,clan_tag,status,created_at").eq("applicant_id",u.id).order("created_at",{ascending:false})]);
if(members.error){$("myClans").textContent="Unable to load clan memberships: "+members.error.message;}else if(!members.data.length){$("myClans").innerHTML='<div class="empty">You are not listed in a clan yet.</div>';}else{const ids=members.data.map(x=>x.clan_id);const {data:clans,error}=await db.from("clans").select("id,name,tag,status").in("id",ids);$("myClans").innerHTML=error?esc(error.message):members.data.map(m=>{const c=clans.find(x=>x.id===m.clan_id);return c?'<div class="item"><b>'+esc(c.name)+' ['+esc(c.tag)+']</b><p class="muted">'+esc(m.role)+' · '+esc(c.status)+'</p></div>':""}).join("")||'<div class="empty">No clan details available.</div>';}
if(apps.error){$("myApps").textContent="Unable to load applications: "+apps.error.message;}else if(!apps.data.length){$("myApps").innerHTML='<div class="empty">You have not submitted a clan application.</div>';}else{$("myApps").innerHTML=apps.data.map(a=>'<div class="item"><b>'+esc(a.clan_name)+' ['+esc(a.clan_tag)+']</b><p class="muted"><span class="status">'+esc(a.status)+'</span> · '+new Date(a.created_at).toLocaleDateString()+'</p></div>').join("");}
})();
$("logout").addEventListener("click",async()=>{await db.auth.signOut();location.href="index.html";});
</script></body></html>
