<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clan Directory | BCMS</title><link rel="stylesheet" href="style.css"><style>
.directory{padding:65px 10%;min-height:65vh}.directory-header{margin-bottom:30px}.directory-header h1{font-size:42px;margin-bottom:12px}.directory-header p{color:#91a1ba}.search-box{width:100%;padding:15px;margin:20px 0;background:#101c30;border:1px solid #344763;border-radius:8px;color:white}.clan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.clan-card{background:#101c30;border:1px solid #233651;border-radius:10px;padding:23px}.clan-card p{color:#91a1ba;font-size:14px;line-height:1.6;margin-top:10px}.tag{color:#2583ff;font-weight:700}.status{display:inline-block;color:#8fc2ff;background:#142e50;padding:6px 10px;border-radius:5px;font-size:11px;margin-bottom:14px}.muted{color:#91a1ba}
</style></head><body><header class="navbar"><a href="index.html" class="logo">BCMS<span>.</span></a><nav><a href="index.html">Home</a><a href="index.html#council">Council</a><a href="index.html#announcements">News</a></nav><div class="nav-actions"><a class="login" href="auth.html">Log In</a><a class="button" href="apply.html">Register Clan</a></div></header>
<main class="directory"><div class="directory-header"><p class="eyebrow">THE COMMUNITY DIRECTORY</p><h1>Clan Directory</h1><p>Discover approved clans, explore their profiles, and find your community.</p></div><input type="search" id="clanSearch" class="search-box" placeholder="Search clans by name or tag…"><p id="directoryMessage" class="muted">Loading approved clans…</p><div class="clan-grid" id="clanGrid"></div></main><footer><div class="logo">BCMS<span>.</span></div><p>Bonk.io Clan Management System</p><p>Independent community platform; not affiliated with Bonk.io.</p></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),grid=document.getElementById("clanGrid"),msg=document.getElementById("directoryMessage"),search=document.getElementById("clanSearch");let clans=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){const q=search.value.trim().toLowerCase(),filtered=clans.filter(c=>(c.name+" "+c.tag+" "+(c.description||"")).toLowerCase().includes(q));grid.innerHTML=filtered.map(c=>'<article class="clan-card"><span class="status">'+esc(c.recruitment_status||"Community")+'</span><h2>'+esc(c.name)+'</h2><p class="tag">['+esc(c.tag)+']</p><p>'+esc(c.description||"No description provided.")+'</p>'+(c.colors?'<p><b>Colors:</b> '+esc(c.colors)+'</p>':"")+'</article>').join("");msg.textContent=filtered.length?filtered.length+" approved clan"+(filtered.length===1?"":"s")+" listed.":(clans.length?"No clans match your search.":"No approved clans yet. Be the first to apply.");}
search.addEventListener("input",render);
(async()=>{const {data,error}=await db.from("clans").select("id,name,tag,description,colors,recruitment_status").eq("status","approved").order("created_at",{ascending:false});if(error){msg.textContent="Could not load the directory: "+error.message;return;}clans=data||[];render();})();
</script></body></html>
