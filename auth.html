
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCMS | Account Access</title>
<link rel="stylesheet" href="style.css">
<style>
.auth-container {
  max-width:460px;
  margin:75px auto;
  padding:35px;
  background:#101c30;
  border:1px solid #233651;
  border-radius:12px;
}
.auth-tabs { display:flex; gap:10px; margin:25px 0; }
.auth-tabs button {
  flex:1; padding:12px; background:#080f1e;
  border:1px solid #344763; color:#91a1ba;
  border-radius:7px; cursor:pointer;
}
.auth-tabs button.active {
  background:#2583ff; color:white; border-color:#2583ff;
}
.auth-field { margin-bottom:20px; }
.auth-field label {
  display:block; margin-bottom:8px; font-size:13px;
}
.auth-field input, .auth-field select {
  width:100%; padding:14px; background:#080f1e;
  border:1px solid #344763; border-radius:7px; color:white;
}
.auth-form button { width:100%; border:0; cursor:pointer; }
.auth-note { color:#91a1ba; font-size:12px; margin-top:20px; }
.hidden { display:none !important; }
</style>
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">BCMS<span>.</span></a>
  <a href="index.html" class="login">Back to Home</a>
</header>

<main class="auth-container">
  <p class="eyebrow">COMMUNITY ACCESS</p>
  <h1 id="formTitle">Welcome Back</h1>

  <div class="auth-tabs">
    <button type="button" id="loginTab" class="active">Log In</button>
    <button type="button" id="registerTab">Register</button>
  </div>

  <form id="loginForm" class="auth-form">
    <div class="auth-field">
      <label>Email Address</label>
      <input id="loginEmail" type="email" required>
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input id="loginPassword" type="password" required>
    </div>
    <button class="button" type="submit">Log In</button>
  </form>

  <form id="registerForm" class="auth-form hidden">
    <div class="auth-field">
      <label>Display Name</label>
      <input id="registerUsername" required>
    </div>
    <div class="auth-field">
      <label>Email Address</label>
      <input id="registerEmail" type="email" required>
    </div>
    <div class="auth-field">
      <label>Password (minimum 8 characters)</label>
      <input id="registerPassword" type="password" minlength="8" required>
    </div>
    <button class="button" type="submit">Create Account</button>
  </form>

  <p id="message" class="auth-note">
    Your BCMS community account.
  </p>
</main>

<script>
// Tab switching works independently of Supabase.
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const formTitle = document.getElementById("formTitle");
const message = document.getElementById("message");

function showForm(type) {
  const registering = type === "register";

  loginForm.classList.toggle("hidden", registering);
  registerForm.classList.toggle("hidden", !registering);
  loginTab.classList.toggle("active", !registering);
  registerTab.classList.toggle("active", registering);

  formTitle.textContent = registering ? "Create Account" : "Welcome Back";
  message.textContent = registering
    ? "Create your BCMS community account."
    : "Log in to your BCMS account.";
}

loginTab.addEventListener("click", () => showForm("login"));
registerTab.addEventListener("click", () => showForm("register"));
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
// Actual Supabase authentication.
loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "Logging in...";

  try {
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: document.getElementById("loginEmail").value,
      password: document.getElementById("loginPassword").value
    });

    if (error) throw error;
    window.location.href = "index.html";
  } catch (error) {
    message.textContent = error.message;
  }
});

registerForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "Creating account...";

  try {
    const { error } = await supabaseClient.auth.signUp({
      email: document.getElementById("registerEmail").value,
      password: document.getElementById("registerPassword").value,
      options: {
        data: {
          username: document.getElementById("registerUsername").value
        }
      }
    });

    if (error) throw error;
    message.textContent = "Account created! Check your email for confirmation.";
  } catch (error) {
    message.textContent = error.message;
  }
});
</script>

</body>
</html>
