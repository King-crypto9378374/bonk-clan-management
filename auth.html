
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCMS | Account Access</title>
<link rel="stylesheet" href="style.css">
<style>
.auth-container {
  max-width: 460px;
  margin: 75px auto;
  padding: 35px;
  background: #101c30;
  border: 1px solid #233651;
  border-radius: 12px;
}
.auth-tabs {
  display: flex;
  gap: 10px;
  margin: 25px 0;
}
.auth-tabs button {
  flex: 1;
  padding: 12px;
  background: #080f1e;
  border: 1px solid #344763;
  color: #91a1ba;
  border-radius: 7px;
  cursor: pointer;
}
.auth-tabs button.active {
  background: #2583ff;
  color: white;
  border-color: #2583ff;
}
.auth-field { margin-bottom: 20px; }
.auth-field label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 700;
}
.auth-field input, .auth-field select {
  width: 100%;
  padding: 14px;
  background: #080f1e;
  border: 1px solid #344763;
  border-radius: 7px;
  color: white;
}
.auth-form button {
  width: 100%;
  border: none;
  cursor: pointer;
  font: inherit;
}
.auth-note {
  color: #91a1ba;
  font-size: 12px;
  line-height: 1.6;
  margin-top: 20px;
}
.hidden { display: none; }
</style>
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">BCMS<span>.</span></a>
  <a href="index.html" class="login">Back to Home</a>
</header>

<main class="auth-container">
  <p class="eyebrow">COMMUNITY ACCESS</p>
  <h1 id="formTitle">Welcome Back</h1>
  <p style="color:#91a1ba;margin-top:10px">
    Access your BCMS account.
  </p>

  <div class="auth-tabs">
    <button id="loginTab" class="active" type="button">Log In</button>
    <button id="registerTab" type="button">Register</button>
  </div>

  <form id="loginForm" class="auth-form">
    <div class="auth-field">
      <label>Email Address</label>
      <input type="email" required placeholder="you@example.com">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" required placeholder="Your password">
    </div>
    <button class="button" type="submit">Log In</button>
  </form>

  <form id="registerForm" class="auth-form hidden">
    <div class="auth-field">
      <label>Display Name</label>
      <input type="text" required placeholder="Your username">
    </div>
    <div class="auth-field">
      <label>Email Address</label>
      <input type="email" required placeholder="you@example.com">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" minlength="8" required placeholder="At least 8 characters">
    </div>
    <div class="auth-field">
      <label>Account Type</label>
      <select required>
        <option value="member">Community Member</option>
        <option value="leader">Clan Leader</option>
      </select>
    </div>
    <button class="button" type="submit">Create Account</button>
  </form>

  <p class="auth-note">
    Clan leaders and members use the same account system.
    Administrative privileges are assigned separately by the organization.
  </p>
</main>

<script>
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");
const formTitle = document.getElementById("formTitle");

function showForm(type) {
  const registering = type === "register";
  loginForm.classList.toggle("hidden", registering);
  registerForm.classList.toggle("hidden", !registering);
  loginTab.classList.toggle("active", !registering);
  registerTab.classList.toggle("active", registering);
  formTitle.textContent = registering ? "Create Account" : "Welcome Back";
}

loginTab.addEventListener("click", () => showForm("login"));
registerTab.addEventListener("click", () => showForm("register"));

loginForm.addEventListener("submit", event => {
  event.preventDefault();
  alert("Authentication will be activated when Supabase is connected.");
});

registerForm.addEventListener("submit", event => {
  event.preventDefault();
  alert("Registration will be activated when Supabase is connected.");
});
</script>

</body>
</html>
