
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCMS | Account Access</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #081426;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .auth-box {
      width: 100%;
      max-width: 420px;
      background: #10223b;
      padding: 30px;
      border-radius: 14px;
      border: 1px solid #24466e;
    }
    h1 { text-align: center; margin-top: 0; }
    .tabs { display: flex; gap: 10px; margin-bottom: 22px; }
    .tabs button, .submit-btn {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 7px;
      background: #183657;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    .tabs button.active, .submit-btn {
      background: #2478d4;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0 15px;
      border-radius: 7px;
      border: 1px solid #355578;
      background: #09182b;
      color: white;
    }
    label { font-size: 14px; }
    .submit-btn { width: 100%; margin-top: 8px; }
    #message { text-align: center; margin-top: 16px; }
    .hidden { display: none; }
    .back { text-align: center; margin-top: 20px; }
    a { color: #70b5ff; }
  </style>
</head>
<body>

  <main class="auth-box">
    <h1>BCMS</h1>
    <p style="text-align:center">Bonk Clan Management System</p>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">Login</button>
      <button id="registerTab" type="button">Register</button>
    </div>

    <form id="loginForm">
      <label>Email</label>
      <input id="loginEmail" type="email" required>

      <label>Password</label>
      <input id="loginPassword" type="password" required>

      <button class="submit-btn" type="submit">Log In</button>
    </form>

    <form id="registerForm" class="hidden">
      <label>Username</label>
      <input id="registerUsername" type="text" maxlength="24"
        placeholder="Choose a username" required>

      <label>Email</label>
      <input id="registerEmail" type="email" required>

      <label>Password</label>
      <input id="registerPassword" type="password"
        minlength="8" required>

      <p style="font-size:12px;color:#a9bdd5">
        New accounts start as Community Members.
        Staff permissions are assigned separately.
      </p>

      <button class="submit-btn" type="submit">Create Account</button>
    </form>

    <p id="message" role="status"></p>

    <div class="back">
      <a href="index.html">Back to Home</a>
    </div>
  </main>

  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Existing project key -->
  <script src="supabase.js"></script>

  <script>
    // Use the clean project URL directly for authentication.
    // This avoids accidentally adding /rest/v1 to auth requests.
    const authClient = window.supabase.createClient(
      "https://lexpuxqmrmbmozdlebvm.supabase.co",
      SUPABASE_KEY
    );

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("message");

    function showLogin() {
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
      loginTab.classList.add("active");
      registerTab.classList.remove("active");
      message.textContent = "";
    }

    function showRegister() {
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      registerTab.classList.add("active");
      loginTab.classList.remove("active");
      message.textContent = "";
    }

    loginTab.addEventListener("click", showLogin);
    registerTab.addEventListener("click", showRegister);

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      message.textContent = "Logging in...";

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      const { error } = await authClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      window.location.href = "index.html";
    });

    registerForm.addEventListener("submit", async function(event) {
      event.preventDefault();
      message.textContent = "Creating account...";

      const username = document
        .getElementById("registerUsername").value.trim();

      const email = document
        .getElementById("registerEmail").value.trim();

      const password = document
        .getElementById("registerPassword").value;

      if (!/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
        message.textContent =
          "Username must be 3–24 characters using letters, numbers, or underscores.";
        return;
      }

      const { data, error } = await authClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            username: username
          }
        }
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      if (data.session) {
        message.textContent = "Account created! Redirecting...";
        window.location.href = "index.html";
      } else {
        message.textContent =
          "Account created! Check your email to confirm your account.";
      }
    });
  </script>
</body>
</html>
