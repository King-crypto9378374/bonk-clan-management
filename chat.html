<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Chat | BCMS</title><link rel="stylesheet" href="style.css"><style>
.chat-page{max-width:1200px;margin:38px auto;padding:0 18px}.chat-layout{display:grid;grid-template-columns:260px 1fr;gap:18px;min-height:650px}.chat-sidebar,.chat-main{background:#101c30;border:1px solid #233651;border-radius:12px}.chat-sidebar{padding:18px}.chat-sidebar h2{font-size:17px;margin:8px 0 12px}.channel-button{display:block;width:100%;text-align:left;background:#0b1425;color:#c3d3e8;border:1px solid #233651;border-radius:7px;padding:12px;margin:7px 0;cursor:pointer}.channel-button.active{background:#17345a;border-color:#2583ff;color:white}.chat-main{display:flex;flex-direction:column;min-width:0;overflow:hidden}.chat-head{padding:20px;border-bottom:1px solid #233651}.chat-head p,.muted{color:#91a1ba}.messages{height:480px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.message{background:#0b1425;border:1px solid #233651;border-radius:9px;padding:12px 14px;max-width:90%;align-self:flex-start}.message.mine{align-self:flex-end;border-color:#285b92}.message-meta{font-size:12px;color:#8fc2ff;margin-bottom:6px}.message-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}.composer{display:flex;gap:10px;padding:15px;border-top:1px solid #233651}.composer textarea{flex:1;resize:vertical;min-height:48px;max-height:130px;background:#0b1425;color:white;border:1px solid #344763;border-radius:7px;padding:12px;font:inherit}.composer button{background:#2583ff;color:white;border:0;border-radius:7px;padding:0 20px;cursor:pointer}.composer button:disabled{opacity:.5}.notice{padding:18px;color:#91a1ba}.channel-group{margin-top:18px}.channel-group:first-of-type{margin-top:0}
@media(max-width:720px){.chat-layout{grid-template-columns:1fr}.chat-sidebar{display:flex;flex-wrap:wrap;gap:6px}.channel-group{width:100%}.channel-button{width:auto;display:inline-block;margin:3px}.messages{height:55vh;min-height:300px}.composer{padding:10px}.composer button{padding:0 12px}}
</style></head><body>
<header class="navbar"><a href="index.html" class="logo">BCMS<span>.</span></a><nav><a href="clans.html">Clans</a><a href="council.html">Council</a><a href="index.html#announcements">News</a><a href="bonkio.html">Bonk.io</a></nav><div class="nav-actions"><a class="login" href="account.html">My Account</a></div></header>
<main class="chat-page"><p class="eyebrow">COMMUNITY CONNECTION</p><h1>Live Chat</h1><p class="muted" style="margin:10px 0 22px">Choose a room to talk with your community.</p><div id="pageNotice" class="notice">Checking your account…</div>
<div class="chat-layout" id="chatLayout" hidden><aside class="chat-sidebar"><div class="channel-group"><h2>Public</h2><div id="publicChannels"></div></div><div class="channel-group" id="leaderGroup" hidden><h2>Leadership</h2><div id="leaderChannels"></div></div><div class="channel-group" id="clanGroup" hidden><h2>My Clan Rooms</h2><div id="clanChannels"></div></div><div class="channel-group" id="staffGroup" hidden><h2>Organization</h2><div id="staffChannels"></div></div></aside><section class="chat-main"><div class="chat-head"><h2 id="channelTitle">Community Chat</h2><p id="channelDescription">Chat with BCMS members.</p></div><div class="messages" id="messages"><div class="notice">Loading messages…</div></div><form class="composer" id="messageForm"><textarea id="messageInput" maxlength="1000" placeholder="Write a message…" required></textarea><button id="sendButton" type="submit">Send</button></form></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user=null,currentChannel=null,channels=[],subscription=null;
function addChannel(channel){channels.push(channel);const target=$(channel.group);const b=document.createElement("button");b.className="channel-button";b.textContent=channel.label;b.type="button";b.addEventListener("click",()=>openChannel(channel,b));target.appendChild(b);const groupToggle={leaderChannels:"leaderGroup",clanChannels:"clanGroup",staffChannels:"staffGroup"}[channel.group];if(groupToggle)$(groupToggle).hidden=false;}
function showNotice(message){$("pageNotice").hidden=false;$("pageNotice").textContent=message;$("chatLayout").hidden=true;}
async function openChannel(channel,button){currentChannel=channel;document.querySelectorAll(".channel-button").forEach(x=>x.classList.remove("active"));if(button)button.classList.add("active");else{const match=[...document.querySelectorAll(".channel-button")].find(x=>x.textContent===channel.label);match?.classList.add("active");}
$("channelTitle").textContent=channel.label;$("channelDescription").textContent=channel.description;$("messages").innerHTML='<div class="notice">Loading messages…</div>';const filter=channel.type==="clan"?{channel_type:"clan",clan_id:channel.clanId}:{channel_type:channel.type,clan_id:null};let query=db.from("chat_messages").select("id,channel_type,clan_id,sender_id,sender_name,content,created_at").eq("channel_type",filter.channel_type);query=filter.clan_id?query.eq("clan_id",filter.clan_id):query.is("clan_id",null);const {data,error}=await query.order("created_at",{ascending:true}).limit(100);if(error){$("messages").innerHTML='<div class="notice">Could not load messages: '+esc(error.message)+'</div>';return;}renderMessages(data||[]);}
function appendMessage(m){const box=$("messages");if(box.querySelector(`[data-message-id="${m.id}"]`))return;const empty=box.querySelector(".notice");if(empty)box.innerHTML="";const article=document.createElement("article");article.className="message "+(m.sender_id===user.id?"mine":"");article.dataset.messageId=m.id;article.innerHTML='<div class="message-meta">'+esc(m.sender_name||"Member")+' · '+new Date(m.created_at).toLocaleString()+'</div><div class="message-text">'+esc(m.content)+'</div>';box.appendChild(article);box.scrollTop=box.scrollHeight;}\nfunction renderMessages(rows){$("messages").innerHTML=rows.length?'':'<div class="notice">No messages yet. Start the conversation.</div>';rows.forEach(appendMessage);$("messages").scrollTop=$("messages").scrollHeight;}
$("messageForm").addEventListener("submit",async e=>{e.preventDefault();const content=$("messageInput").value.trim();if(!content||!currentChannel)return;$("sendButton").disabled=true;const row={channel_type:currentChannel.type,clan_id:currentChannel.clanId||null,sender_id:user.id,content};const {data,error}=await db.from("chat_messages").insert(row).select("id,channel_type,clan_id,sender_id,sender_name,content,created_at").single();$("sendButton").disabled=false;if(error){$("pageNotice").hidden=false;$("pageNotice").textContent="Message not sent: "+error.message;return;}appendMessage(data);$("messageInput").value="";$("pageNotice").hidden=true;});
(async()=>{const {data:{session}}=await db.auth.getSession();if(!session){showNotice("Please log in to use BCMS Live Chat. ");$("pageNotice").innerHTML='Please <a href="auth.html">log in</a> to use BCMS Live Chat.';return;}user=session.user;$("pageNotice").hidden=true;$("chatLayout").hidden=false;addChannel({type:"community",clanId:null,label:"Community Chat",description:"A shared room for all registered BCMS members.",group:"publicChannels"});
const {data:members}=await db.from("clan_members").select("clan_id,role").eq("user_id",user.id);const memberRows=members||[];const leaderIds=memberRows.filter(x=>x.role==="leader").map(x=>x.clan_id);if(leaderIds.length)addChannel({type:"leaders",clanId:null,label:"Clan Leaders",description:"A private room for approved clan leaders.",group:"leaderChannels"});
const clanIds=[...new Set(memberRows.map(x=>x.clan_id))];if(clanIds.length){const {data:myClans}=await db.from("clans").select("id,name,tag,status").in("id",clanIds).eq("status","approved");(myClans||[]).forEach(c=>addChannel({type:"clan",clanId:c.id,label:c.name+" ["+c.tag+"]",description:"Private chat for members of "+c.name+".",group:"clanChannels"}));}
const {data:staff}=await db.from("organization_staff").select("role").eq("user_id",user.id).maybeSingle();if(staff)addChannel({type:"staff",clanId:null,label:"Staff Chat",description:"Private organization chat for moderators, administrators, and the founder.",group:"staffChannels"});
await openChannel(channels[0]);subscription=db.channel("bcms-live-chat").on("postgres_changes",{event:"INSERT",schema:"public",table:"chat_messages"},payload=>{const m=payload.new;if(!currentChannel||m.channel_type!==currentChannel.type||(m.clan_id||null)!==(currentChannel.clanId||null))return;appendMessage(m);}).subscribe();
})();
</script></body></html>
