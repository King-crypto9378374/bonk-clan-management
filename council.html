<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clan Council | BCMS</title><link rel="stylesheet" href="style.css"><style>
.page{max-width:1000px;margin:55px auto;padding:0 20px}.proposal{background:#101c30;border:1px solid #233651;border-radius:12px;padding:24px;margin:18px 0}.proposal p{color:#91a1ba;line-height:1.7;margin:12px 0}.tag{display:inline-block;background:#142e50;color:#8fc2ff;padding:5px 9px;border-radius:20px;font-size:12px}.vote-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.vote-row select{padding:10px;background:#0b1425;color:white;border:1px solid #344763;border-radius:6px}.counts{font-size:13px;color:#91a1ba}.message{margin:15px 0;color:#8fc2ff}
</style></head><body><header class="navbar"><a href="index.html" class="logo">BCMS<span>.</span></a><nav><a href="clans.html">Clans</a><a href="chat.html">Live Chat</a><a href="index.html#announcements">News</a></nav><div class="nav-actions"><a class="login" href="account.html">My Account</a></div></header>
<main class="page"><p class="eyebrow">COMMUNITY GOVERNANCE</p><h1>The Clan Council</h1><p style="color:#91a1ba;margin:12px 0 25px">Clan leaders can cast one vote per clan on open proposals.</p><div id="message" class="message"></div><div id="proposals">Loading proposals…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user=null,leaderClans=[];
async function vote(proposalId,clanId){const choice=document.getElementById("vote-"+proposalId).value;const {error}=await db.from("council_votes").insert({proposal_id:proposalId,clan_id:clanId,vote:choice});if(error){$("message").textContent=error.code==="23505"?"Your clan has already voted on this proposal.":error.message;return;} $("message").textContent="Your clan's vote has been recorded.";await load();}
async function load(){const {data:proposals,error}=await db.from("council_proposals").select("id,title,description,status,created_at").order("created_at",{ascending:false});if(error){$("proposals").textContent=error.message;return;}const ids=proposals.map(p=>p.id);let votes=[];if(ids.length){const r=await db.from("council_votes").select("proposal_id,vote").in("proposal_id",ids);if(!r.error)votes=r.data||[];}
$("proposals").innerHTML=proposals.length?proposals.map(p=>{const tally={yes:0,no:0,abstain:0};votes.filter(v=>v.proposal_id===p.id).forEach(v=>{if(tally[v.vote]!==undefined)tally[v.vote]++;});const controls=p.status==="open"&&leaderClans.length?'<div class="vote-row"><select id="vote-'+esc(p.id)+'"><option value="yes">Yes</option><option value="no">No</option><option value="abstain">Abstain</option></select>'+leaderClans.map(c=>'<button class="button" data-vote="'+esc(p.id)+'" data-clan="'+esc(c.id)+'">Vote as '+esc(c.name)+'</button>').join("")+'</div>':"";return '<article class="proposal"><span class="tag">'+esc(p.status)+'</span><h2 style="margin-top:12px">'+esc(p.title)+'</h2><p>'+esc(p.description)+'</p><div class="counts">Yes: '+tally.yes+' · No: '+tally.no+' · Abstain: '+tally.abstain+'</div>'+controls+'</article>';}).join(""):'<div class="proposal">No proposals have been published yet.</div>';}
document.addEventListener("click",e=>{const b=e.target.closest("[data-vote]");if(b)vote(b.dataset.vote,b.dataset.clan);});
(async()=>{const {data:{session}}=await db.auth.getSession();user=session?.user||null;if(user){const {data}=await db.from("clan_members").select("clan_id,role").eq("user_id",user.id).eq("role","leader");const ids=(data||[]).map(x=>x.clan_id);if(ids.length){const {data:clans}=await db.from("clans").select("id,name,status").in("id",ids).eq("status","approved");leaderClans=clans||[];}}if(!user)$("message").textContent="Log in as an approved clan leader to vote.";else if(!leaderClans.length)$("message").textContent="Voting is reserved for approved clan leaders. Your clan must be registered and approved.";await load();})();
</script></body></html>
